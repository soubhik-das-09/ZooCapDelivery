
name: ZooCapDelivery CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  security-events: write
  actions: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: zoocapdelivery
  AWS_ACCOUNT_ID: "612524168786"
  EC2_HOST: ${{ vars.EC2_HOST }}
  EC2_USER: ubuntu

jobs:
  build-and-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 3. Build Spring Boot JAR
      - name: Build JAR
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # 4. Configure AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::612524168786:role/GitHubActionsZooCapRole
          aws-region: eu-north-1
          role-session-name: ZooCapDeployment
    
      # 5. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 6. Build and push Docker image
      - name: Build and push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # 7. Deploy image to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
        with:
          host: ${{ vars.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_REGION,AWS_ACCOUNT_ID,IMAGE_TAG,ECR_REPOSITORY
          script: |
            set -e

            REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
            IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

            aws ecr get-login-password --region "$AWS_REGION" \
              | sudo docker login --username AWS --password-stdin "$REGISTRY"

            sudo docker pull "$IMAGE"

            sudo docker stop zoocap || true
            sudo docker rm zoocap || true

            sudo docker run -d \
              --name zoocap \
              --restart unless-stopped \
              -p 8080:8080 \
              "$IMAGE"

            sudo docker image prune -f
