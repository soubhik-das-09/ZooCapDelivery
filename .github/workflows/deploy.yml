
name: ZooCapDelivery CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-north-1
  AWS_ACCOUNT_ID: "612524168786"
  ECR_REPOSITORY: zoocapdelivery
  LAUNCH_TEMPLATE_NAME: ZooCap-ASG-Template
  ASG_NAME: ZooCap-ASG

jobs:
  build-and-deploy:
    name: Build, Push and Deploy to ASG
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build Spring Boot JAR
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Create new Launch Template version
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          # Get the existing Launch Template configuration.
          aws ec2 describe-launch-template-versions \
            --launch-template-name "$LAUNCH_TEMPLATE_NAME" \
            --versions '$Latest' \
            --query 'LaunchTemplateVersions[0].LaunchTemplateData' \
            --output json > launch-template-data.json

          # Create the startup script for new ASG instances.
          cat > user-data.sh <<EOF
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee -a /var/log/zoocap-user-data.log) 2>&1

          apt-get update -y
          apt-get install -y docker.io awscli

          systemctl enable docker
          systemctl start docker

          aws ecr get-login-password --region ${AWS_REGION} \
            | docker login --username AWS --password-stdin ${REGISTRY}

          docker pull ${IMAGE}

          docker stop zoocap || true
          docker rm zoocap || true

          docker run -d \
            --name zoocap \
            --restart unless-stopped \
            -p 8080:8080 \
            ${IMAGE}
          EOF

          # Encode User Data and preserve the rest of the Launch Template.
          USER_DATA=$(base64 -w 0 user-data.sh)

          jq --arg userData "$USER_DATA" \
            '.UserData = $userData' \
            launch-template-data.json > updated-launch-template-data.json

          # Create a new version based on the existing configuration.
          aws ec2 create-launch-template-version \
            --launch-template-name "$LAUNCH_TEMPLATE_NAME" \
            --source-version '$Latest' \
            --version-description "GitHub Actions deployment ${IMAGE_TAG}" \
            --launch-template-data file://updated-launch-template-data.json

      - name: Update Auto Scaling Group Launch Template
        run: |
          set -euo pipefail

          NEW_VERSION=$(aws ec2 describe-launch-template-versions \
            --launch-template-name "$LAUNCH_TEMPLATE_NAME" \
            --versions '$Latest' \
            --query 'LaunchTemplateVersions[0].VersionNumber' \
            --output text)

          echo "Using Launch Template version: $NEW_VERSION"

          aws autoscaling update-auto-scaling-group \
            --auto-scaling-group-name "$ASG_NAME" \
            --launch-template "LaunchTemplateName=${LAUNCH_TEMPLATE_NAME},Version=${NEW_VERSION}"

      - name: Start Auto Scaling Instance Refresh
        id: refresh
        run: |
          set -euo pipefail

          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{
              "MinHealthyPercentage": 100,
              "MaxHealthyPercentage": 200,
              "InstanceWarmup": 300,
              "SkipMatching": true
            }' \
            --query 'InstanceRefreshId' \
            --output text)

          echo "Instance Refresh ID: $REFRESH_ID"
          echo "REFRESH_ID=$REFRESH_ID" >> "$GITHUB_ENV"

      - name: Wait for Instance Refresh
        run: |
          set -euo pipefail

          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query 'InstanceRefreshes[0].Status' \
              --output text)

            echo "Instance Refresh status: $STATUS"

            case "$STATUS" in
              Successful)
                echo "Deployment completed successfully."
                break
                ;;
              Failed|Cancelled|RollbackFailed)
                echo "Deployment failed with status: $STATUS"
                exit 1
                ;;
              *)
                sleep 30
                ;;
            esac
          done
